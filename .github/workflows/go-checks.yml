name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests (excluding laptop latency budgets)
        run: |
          CGO_ENABLED=1 go test -p=1 ./... -count=1 -timeout 20m \
            -skip '^Test(NoticeCallBudget|ControlCallBudget|AnswerCallBudget|ResponseBarrierBudget|SettingsCallBudget|NoteCallBudget|BrowserCallBudget|EndCallBudget|StackBusyFlipBudget|StackPatchApplyBudget|StackRoundTripBudget|AKeyPressOverThePipeBudget)$'
      - name: Go vet
        run: CGO_ENABLED=1 go vet ./...

  usability:
    name: Scripted usability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build marshal
        run: CGO_ENABLED=1 go build ./cmd/marshal
      - name: Run scripted usability tests
        env:
          USABILITY_REQUIRE_BINARY: "1"
          USABILITY_REPORT_DIR: ${{ runner.temp }}/marshal-usability
        run: go test ./test/usability/... -run TestScripted -v -count=1 -timeout 5m
      - name: Upload usability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usability-report
          path: ${{ runner.temp }}/marshal-usability/
          if-no-files-found: ignore

  # The app's Dart tests and the Studio's web build. `flutter test` here is the
  # pure-Dart half of the app — the status models, the menu model, the Studio's
  # models and the fixture both languages read — so it needs no GTK, no display
  # and no build of the desktop runner. The Studio's web build is made here
  # because it is what `go:embed` bakes into webbridge; the bundles themselves
  # are built in the release workflow, on the OSes that can build them.
  app:
    name: App tests and Studio build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version this app was developed and last verified against,
      # not a floating channel: a Flutter upgrade changes the analyzer's rules
      # and the formatter's output, and neither should arrive unannounced on a
      # branch that did not touch the app. `app/pubspec.lock` is committed, so
      # `flutter pub get` resolves to the same plugin versions.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The Studio's build is the one `go:embed` bakes into webbridge. Its base
      # href is `/`, and `--no-web-resources-cdn` makes the build fetch the
      # CanvasKit engine from this server instead of gstatic, so a private
      # network that cannot reach the CDN still starts it.
      - name: Build the Studio for /
        run: flutter build web --base-href / --no-web-resources-cdn --output ../web/bridge/static
      - name: The Studio's build embeds
        working-directory: .
        run: CGO_ENABLED=1 go build -o /tmp/webbridge ./cmd/webbridge
      # F8's cutover removed the Svelte Studio with its toolchain: the Studio is
      # the Flutter one, and a reintroduced Node project under web/ would be a
      # second Studio nobody builds. This fails rather than letting one rot in
      # the tree. `scripts/uishot` is not covered: it renders TUI screenshots
      # and has nothing to do with the Studio.
      - name: No Svelte source, and no Node project under web/
        working-directory: .
        run: |
          svelte="$(git ls-files '*.svelte')"
          node="$(git ls-files -- web | grep -E '(^|/)(package\.json|package-lock\.json)$' || true)"
          if [ -n "$svelte$node" ]; then
            echo "the Studio is Flutter; these belong to no build and must go:" >&2
            printf '%s\n%s\n' "$svelte" "$node" >&2
            exit 1
          fi
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

  release-config:
    name: Installer and release config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck the installer
        run: shellcheck scripts/install.sh
      - name: Test the installer's uninstall gate
        run: sh scripts/install_test.sh
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          install-only: true
      # `check` parses the config only: no build, no C toolchain. It exits 1
      # on a config that would fail at tag time and 2 when the config parses
      # but uses a property this GoReleaser deprecates. `brews` is the one
      # deprecation this repository accepts — the formula still publishes and
      # the pinned version has no replacement spelling — so exit 2 passes only
      # when every DEPRECATED line names `brews`. A new, unrelated deprecation
      # must fail here rather than quietly join the tolerated set. The match on
      # `DEPRECATED` is case-sensitive on purpose: GoReleaser's own trailing
      # "configuration is valid, but uses deprecated properties" summary is
      # lowercase, and it names no property.
      - name: GoReleaser config
        run: |
          set +e
          out="$(goreleaser check 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          case "$code" in
          0) exit 0 ;;
          2) ;;
          *) exit "$code" ;;
          esac
          deprecated="$(printf '%s\n' "$out" | grep 'DEPRECATED' || true)"
          if [ -z "$deprecated" ]; then
            echo "goreleaser check exited 2 with no DEPRECATED line to inspect" >&2
            exit 1
          fi
          unexpected="$(printf '%s\n' "$deprecated" | grep -v 'brews' || true)"
          if [ -n "$unexpected" ]; then
            echo "goreleaser check: deprecations other than 'brews' are not accepted:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
