name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests (excluding laptop latency budgets)
        run: |
          CGO_ENABLED=1 go test -p=1 ./... -count=1 -timeout 20m \
            -skip '^Test(NoticeCallBudget|ControlCallBudget|AnswerCallBudget|ResponseBarrierBudget|SettingsCallBudget|NoteCallBudget|BrowserCallBudget|EndCallBudget|StackBusyFlipBudget|StackPatchApplyBudget|StackRoundTripBudget|AKeyPressOverThePipeBudget)$'
      - name: Go vet
        run: CGO_ENABLED=1 go vet ./...

  usability:
    name: Scripted usability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build marshal
        run: CGO_ENABLED=1 go build ./cmd/marshal
      - name: Run scripted usability tests
        env:
          USABILITY_REQUIRE_BINARY: "1"
          USABILITY_REPORT_DIR: ${{ runner.temp }}/marshal-usability
        run: go test ./test/usability/... -run TestScripted -v -count=1 -timeout 5m
      - name: Upload usability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usability-report
          path: ${{ runner.temp }}/marshal-usability/
          if-no-files-found: ignore

  # The app's Dart tests and the Studio's web build. `flutter test` here is the
  # pure-Dart half of the app — the status models, the menu model, the Studio's
  # models and the fixture both languages read — so it needs no GTK, no display
  # and no build of the desktop runner. The Studio's web build is made here
  # because it is what every install ships beside the binaries and what a daemon
  # serves at /; this job builds it, fails on a CDN reference in it, runs its
  # browser-only tests in Chrome and serves it through a real daemon. The
  # bundles themselves are built in the release workflow, on the OSes that can
  # build them.
  app:
    name: App tests and Studio build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Go is here for the last step only: the smoke test builds webbridge and
      # has a real daemon serve the Studio build. The `go` job owns the Go
      # suite, and nothing here links webbridge to the Studio.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Pinned to the version this app was developed and last verified against,
      # not a floating channel: a Flutter upgrade changes the analyzer's rules
      # and the formatter's output, and neither should arrive unannounced on a
      # branch that did not touch the app. `app/pubspec.lock` is committed, so
      # `flutter pub get` resolves to the same plugin versions.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The Studio's build is what every install ships beside the binaries, at
      # share/marshal/studio, and what a local daemon serves at /. Its base href
      # is `/`, and `--no-web-resources-cdn` makes the build fetch the CanvasKit
      # engine from this server instead of gstatic, so a private network that
      # cannot reach the CDN still starts it.
      - name: Build the Studio for /
        run: flutter build web --base-href / --no-web-resources-cdn --output ../share/marshal/studio
      # What this asks, and why it is not a hostname grep. A correct
      # `--no-web-resources-cdn` build still spells gstatic out in three
      # places: the bootstrap keeps the CDN URL in the dead branch beside the
      # flag (`useLocalCanvasKit?…:"https://www.gstatic.com/flutter-canvaskit"`),
      # flutter.js.map carries that source verbatim, and the engine itself
      # defaults its font base to fonts.gstatic.com. Searching for the string
      # therefore fails a good build and tells nothing apart. Where the engine
      # actually comes from does, and only the second assert below separates
      # the two builds: Flutter 3.50 copies canvaskit/ into a default build
      # too, so a build made without `--no-web-resources-cdn` has the wasm
      # file and fetches the engine from gstatic at run time anyway — blank on
      # a network that cannot reach it, invisible on a host that can. What it
      # never has is `"useLocalCanvasKit":true` in its build config. The first
      # assert keeps a build that ships no engine at all (an older Flutter's
      # fetch-only output) from passing either.
      # scripts/e2e/checks_spa.py makes the same assertions against the build a
      # daemon serves at run time.
      - name: The Studio's engine is local, not a CDN
        working-directory: .
        run: |
          studio=share/marshal/studio
          engine="$studio/canvaskit/canvaskit.wasm"
          if [ ! -f "$engine" ]; then
            echo "the Studio build ships no local CanvasKit engine: $engine is not a regular file, so the Studio fetches its engine from a CDN at run time. Build it with:" >&2
            echo "  cd app && flutter build web --base-href / --no-web-resources-cdn --output ../share/marshal/studio" >&2
            exit 1
          fi
          if ! grep -q '"useLocalCanvasKit":true' "$studio/flutter_bootstrap.js"; then
            echo "the Studio build does not name its own CanvasKit engine: $studio/flutter_bootstrap.js carries no \"useLocalCanvasKit\":true, so it fetches the engine from a CDN at run time. Build it with:" >&2
            echo "  cd app && flutter build web --base-href / --no-web-resources-cdn --output ../share/marshal/studio" >&2
            exit 1
          fi
      # For inspecting what this job built. The release builds its own Studio,
      # on the OS whose bundle it goes into, so it consumes no artifact, and
      # this name is deliberately not `studio-web`: release.yaml calls this
      # workflow and also uploads `studio-web` itself, and upload-artifact@v4
      # refuses a duplicate name, which would fail whichever uploaded second.
      - uses: actions/upload-artifact@v4
        with:
          name: studio-web-appjob
          path: share/marshal/studio/
          if-no-files-found: error
      # `flutter test` on the VM skips a test marked `@TestOn('browser')`, so the
      # browser transport (test/client/transport_web_test.dart) had no test in
      # CI at all. Chrome is on ubuntu-latest; `--platform chrome` is what runs
      # them. The files are found by their marker rather than listed, so a new
      # browser-only test is not left out of the run.
      - name: Browser tests
        run: |
          files="$(grep -rl "@TestOn('browser')" test)"
          if [ -z "$files" ]; then
            echo "no test is marked @TestOn('browser'); the browser half is untested" >&2
            exit 1
          fi
          echo "browser-only tests:"; printf '%s\n' "$files"
          flutter test --platform chrome $files
      # F8's cutover removed the Svelte Studio with its toolchain: the Studio is
      # the Flutter one, and a reintroduced Node project under web/ would be a
      # second Studio nobody builds. This fails rather than letting one rot in
      # the tree. `scripts/uishot` is not covered: it renders TUI screenshots
      # and has nothing to do with the Studio.
      - name: No Svelte source, and no Node project under web/
        working-directory: .
        run: |
          svelte="$(git ls-files '*.svelte')"
          node="$(git ls-files -- web | grep -E '(^|/)(package\.json|package-lock\.json)$' || true)"
          if [ -n "$svelte$node" ]; then
            echo "the Studio is Flutter; these belong to no build and must go:" >&2
            printf '%s\n%s\n' "$svelte" "$node" >&2
            exit 1
          fi
      # The build the steps above made, served the way an install serves it: a
      # real webbridge, its own web listener, plan 3's guard in front and the
      # Studio from a directory. Nothing here links webbridge to the Studio, so
      # this is what proves the two halves meet.
      - name: The Studio is served
        working-directory: .
        run: |
          CGO_ENABLED=1 go build -o webbridge ./cmd/webbridge
          scripts/studio-smoke.sh
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

  release-config:
    name: Installer and release config
    runs-on: ubuntu-latest
    # The install gate and `goreleaser check` are seconds; the snapshot archive
    # below builds marshal for this runner, which links tree-sitter.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck the installer
        run: shellcheck scripts/install.sh
      - name: Test the installer's uninstall gate
        run: sh scripts/install_test.sh
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          install-only: true
      # `check` parses the config only: no build, no C toolchain. It exits 1
      # on a config that would fail at tag time and 2 when the config parses
      # but uses a property this GoReleaser deprecates. `brews` is the one
      # deprecation this repository accepts — the formula still publishes and
      # the pinned version has no replacement spelling — so exit 2 passes only
      # when every DEPRECATED line names `brews`. A new, unrelated deprecation
      # must fail here rather than quietly join the tolerated set. The match on
      # `DEPRECATED` is case-sensitive on purpose: GoReleaser's own trailing
      # "configuration is valid, but uses deprecated properties" summary is
      # lowercase, and it names no property.
      - name: GoReleaser config
        run: |
          set +e
          out="$(goreleaser check 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          case "$code" in
          0) exit 0 ;;
          2) ;;
          *) exit "$code" ;;
          esac
          deprecated="$(printf '%s\n' "$out" | grep 'DEPRECATED' || true)"
          if [ -z "$deprecated" ]; then
            echo "goreleaser check exited 2 with no DEPRECATED line to inspect" >&2
            exit 1
          fi
          unexpected="$(printf '%s\n' "$deprecated" | grep -v 'brews' || true)"
          if [ -n "$unexpected" ]; then
            echo "goreleaser check: deprecations other than 'brews' are not accepted:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
      # `check` validates the config's syntax, not what its archive globs
      # actually match, and an archive is only packed at tag time — too late to
      # learn it shipped a Studio directory without the document that makes it
      # one. `studio/**/*` did exactly that: `**` crosses separators, so the
      # pattern needed one more `/` than `studio/index.html` has, and every
      # install and both app bundles would have carried a directory the daemon
      # does not count. So this packs a real archive from a stand-in Studio and
      # reads the entry document back out of it. It runs here, in the job this
      # workflow already gives GoReleaser, because release.yaml only *calls*
      # this workflow: it has no step of its own to hang this on, and this job
      # runs on every pull request, which is the point.
      - name: The archive carries the Studio's index.html
        run: |
          set -euo pipefail
          # share/ and dist/ are gitignored, so the stand-in does not make the
          # tree dirty, which GoReleaser refuses to release from. Both are
          # removed again below, whatever happens.
          trap 'rm -rf share/marshal/studio dist' EXIT
          mkdir -p share/marshal/studio/assets
          printf '<!doctype html><title>stand-in</title>\n' > share/marshal/studio/index.html
          printf '{}\n' > share/marshal/studio/assets/AssetManifest.json
          # --single-target keeps this to the runner's own platform: the darwin
          # builds want osxcross, which a plain ubuntu runner has not, and the
          # guard is about the glob, not the cross toolchain. Docker, Homebrew
          # and publishing are the release job's business.
          goreleaser release --snapshot --clean --single-target \
            --skip=docker,homebrew,publish,validate
          tarball="$(ls dist/*.tar.gz | head -1)"
          echo "inspecting $tarball"
          if ! tar -tzf "$tarball" | grep -qx 'share/marshal/studio/index.html'; then
            echo "$tarball carries no share/marshal/studio/index.html: the archive's Studio glob in .goreleaser.yaml misses the zero-depth index.html, and a daemon does not count such a directory as a Studio. Name the directory (share/marshal/studio) rather than a /**/* pattern under it. What the archive holds under it:" >&2
            tar -tzf "$tarball" | grep 'share/marshal/studio' >&2 || echo "  (nothing)" >&2
            exit 1
          fi
