name: go-checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Full Go test suite
        run: CGO_ENABLED=1 go test ./... -count=1 -timeout 5m
      - name: Go vet
        run: CGO_ENABLED=1 go vet ./...
