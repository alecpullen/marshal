name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/go-checks.yml

  release:
    needs: checks
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: goreleaser/goreleaser-cross:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Registry publishing is not configured; create a binaries-only draft.
      - name: Run GoReleaser
        run: goreleaser release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
