version: 2

project_name: marshal

before:
  hooks:
    - go mod tidy

builds:
  - id: marshal
    main: ./cmd/marshal
    binary: marshal
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=x86_64-linux-gnu-gcc
          - CXX=x86_64-linux-gnu-g++
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
      - goos: darwin
        goarch: amd64
        env:
          - CC=o64-clang
          - CXX=o64-clang++
      - goos: darwin
        goarch: arm64
        env:
          - CC=oa64-clang
          - CXX=oa64-clang++

  - id: webbridge
    main: ./cmd/webbridge
    binary: webbridge
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=x86_64-linux-gnu-gcc
          - CXX=x86_64-linux-gnu-g++
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
      - goos: darwin
        goarch: amd64
        env:
          - CC=o64-clang
          - CXX=o64-clang++
      - goos: darwin
        goarch: arm64
        env:
          - CC=oa64-clang
          - CXX=oa64-clang++

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    # The Studio rides beside the binaries: the daemon serves it from
    # <bin dir>/../share/marshal/studio, and the app bundles and Homebrew put it
    # in the same place. The release workflow downloads it before this runs.
    files:
      - README.md
      - LICENSE
      - share/marshal/studio/**/*

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'

# The darwin binaries are signed with a Developer ID Application certificate
# and notarized, so a download runs without a quarantine removal. Absent the
# secrets this block is skipped, the binaries are unsigned, and the release
# footer says what to do about it.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: '{{ .Env.MACOS_SIGN_P12 }}'
        password: '{{ .Env.MACOS_SIGN_P12_PASSWORD }}'
      notarize:
        issuer_id: '{{ .Env.MACOS_NOTARY_ISSUER_ID }}'
        key_id: '{{ .Env.MACOS_NOTARY_KEY_ID }}'
        key: '{{ .Env.MACOS_NOTARY_KEY }}'

brews:
  - name: marshal
    repository:
      owner: alecpullen
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    directory: Formula
    homepage: https://github.com/alecpullen/marshal
    description: A local-friendly TUI coding agent, and the local daemon it drives
    license: MIT
    # A prerelease tag must not move the formula.
    skip_upload: auto
    install: |
      bin.install "marshal", "webbridge"
      # pkgshare is <prefix>/share/marshal, so the daemon finds the Studio at
      # <bin dir>/../share/marshal/studio.
      pkgshare.install "share/marshal/studio"
    caveats: |
      Run `marshal daemon install` to install and start the background daemon.
      Do not use `brew services`: the daemon writes its own launchd agent or
      systemd user unit.

dockers:
  - id: agent-amd64
    ids: [marshal]
    goos: linux
    goarch: amd64
    dockerfile: build/Dockerfile.release
    image_templates:
      - "ghcr.io/marshal/agent:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
  - id: agent-arm64
    ids: [marshal]
    goos: linux
    goarch: arm64
    dockerfile: build/Dockerfile.release
    image_templates:
      - "ghcr.io/marshal/agent:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
  - id: bridge-amd64
    ids: [webbridge]
    goos: linux
    goarch: amd64
    dockerfile: build/Dockerfile.bridge
    image_templates:
      - "ghcr.io/marshal/webbridge:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
  - id: bridge-arm64
    ids: [webbridge]
    goos: linux
    goarch: arm64
    dockerfile: build/Dockerfile.bridge
    image_templates:
      - "ghcr.io/marshal/webbridge:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/marshal/agent:{{ .Version }}"
    image_templates:
      - "ghcr.io/marshal/agent:{{ .Version }}-amd64"
      - "ghcr.io/marshal/agent:{{ .Version }}-arm64"
  - name_template: "ghcr.io/marshal/agent:latest"
    image_templates:
      - "ghcr.io/marshal/agent:{{ .Version }}-amd64"
      - "ghcr.io/marshal/agent:{{ .Version }}-arm64"
  - name_template: "ghcr.io/marshal/webbridge:{{ .Version }}"
    image_templates:
      - "ghcr.io/marshal/webbridge:{{ .Version }}-amd64"
      - "ghcr.io/marshal/webbridge:{{ .Version }}-arm64"
  - name_template: "ghcr.io/marshal/webbridge:latest"
    image_templates:
      - "ghcr.io/marshal/webbridge:{{ .Version }}-amd64"
      - "ghcr.io/marshal/webbridge:{{ .Version }}-arm64"

release:
  draft: true
  prerelease: auto
  header: |
    ## marshal {{ .Tag }}

    Alpha software. Interfaces, config keys, and on-disk formats may change
    without a migration path before 0.1.0.
  footer: |
    Full release notes are in
    [CHANGELOG.md](https://github.com/alecpullen/marshal/blob/main/CHANGELOG.md).

    ### Install

    ```bash
    brew install alecpullen/tap/marshal
    # or
    curl -fsSL https://raw.githubusercontent.com/alecpullen/marshal/main/scripts/install.sh | sh
    ```

    Both install `marshal` and `webbridge` and run `marshal daemon install`.
    The archives below are the same two binaries, with the Studio beside them
    at `share/marshal/studio`.

    macOS builds are signed and notarized. A release cut without the signing
    secrets is not: if macOS refuses a quarantined download, remove the
    attribute with `xattr -d com.apple.quarantine marshal`.

# Release notes are curated by hand in CHANGELOG.md rather than generated from
# the commit log, which is too granular to be useful to readers.
changelog:
  disable: true
