version: 2

project_name: marshal

before:
  hooks:
    - go mod tidy

builds:
  - id: marshal
    main: ./cmd/marshal
    binary: marshal
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=x86_64-linux-gnu-gcc
          - CXX=x86_64-linux-gnu-g++
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
      - goos: darwin
        goarch: amd64
        env:
          - CC=o64-clang
          - CXX=o64-clang++
      - goos: darwin
        goarch: arm64
        env:
          - CC=oa64-clang
          - CXX=oa64-clang++

  - id: webbridge
    main: ./cmd/webbridge
    binary: webbridge
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=x86_64-linux-gnu-gcc
          - CXX=x86_64-linux-gnu-g++
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
      - goos: darwin
        goarch: amd64
        env:
          - CC=o64-clang
          - CXX=o64-clang++
      - goos: darwin
        goarch: arm64
        env:
          - CC=oa64-clang
          - CXX=oa64-clang++

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'

dockers:
  - id: agent-amd64
    ids: [marshal]
    goos: linux
    goarch: amd64
    dockerfile: build/Dockerfile.release
    image_templates:
      - "ghcr.io/marshal/agent:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
  - id: agent-arm64
    ids: [marshal]
    goos: linux
    goarch: arm64
    dockerfile: build/Dockerfile.release
    image_templates:
      - "ghcr.io/marshal/agent:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
  - id: bridge-amd64
    ids: [webbridge]
    goos: linux
    goarch: amd64
    dockerfile: build/Dockerfile.bridge
    image_templates:
      - "ghcr.io/marshal/webbridge:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
  - id: bridge-arm64
    ids: [webbridge]
    goos: linux
    goarch: arm64
    dockerfile: build/Dockerfile.bridge
    image_templates:
      - "ghcr.io/marshal/webbridge:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/marshal/agent:{{ .Version }}"
    image_templates:
      - "ghcr.io/marshal/agent:{{ .Version }}-amd64"
      - "ghcr.io/marshal/agent:{{ .Version }}-arm64"
  - name_template: "ghcr.io/marshal/agent:latest"
    image_templates:
      - "ghcr.io/marshal/agent:{{ .Version }}-amd64"
      - "ghcr.io/marshal/agent:{{ .Version }}-arm64"
  - name_template: "ghcr.io/marshal/webbridge:{{ .Version }}"
    image_templates:
      - "ghcr.io/marshal/webbridge:{{ .Version }}-amd64"
      - "ghcr.io/marshal/webbridge:{{ .Version }}-arm64"
  - name_template: "ghcr.io/marshal/webbridge:latest"
    image_templates:
      - "ghcr.io/marshal/webbridge:{{ .Version }}-amd64"
      - "ghcr.io/marshal/webbridge:{{ .Version }}-arm64"

release:
  draft: true
  prerelease: auto
  header: |
    ## marshal {{ .Tag }}

    Alpha software. Interfaces, config keys, and on-disk formats may change
    without a migration path before 0.1.0.
  footer: |
    Full release notes are in
    [CHANGELOG.md](https://github.com/alecpullen/marshal/blob/main/CHANGELOG.md).

    ### Install

    Download the archive for your platform below, then:

    ```bash
    tar -xzf marshal_*_<os>_<arch>.tar.gz
    ./marshal --version
    ```

# Release notes are curated by hand in CHANGELOG.md rather than generated from
# the commit log, which is too granular to be useful to readers.
changelog:
  disable: true
